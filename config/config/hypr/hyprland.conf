# Omarchian default Hyprland config.
# Keybindings follow Omarchy's conventions (Super as the main modifier)
# so muscle memory carries over if you've used Omarchy before.

monitor = , preferred, auto, 1

exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1 || /usr/libexec/polkit-kde-authentication-agent-1
exec-once = nm-applet --indicator

source = ~/.config/omarchian/current/theme/hyprland-colors.conf

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1

input {
  kb_layout = us
  follow_mouse = 1
  touchpad {
    natural_scroll = true
  }
  sensitivity = 0
}

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  col.active_border = $primary
  col.inactive_border = $surface
  layout = dwindle
}

decoration {
  rounding = 10
  blur {
    enabled = true
    size = 4
    passes = 2
  }
  shadow {
    enabled = true
    range = 12
  }
}

animations {
  enabled = true
  bezier = easeOutQuint, 0.23, 1, 0.32, 1
  animation = windows, 1, 4, easeOutQuint
  animation = fade, 1, 4, easeOutQuint
  animation = workspaces, 1, 4, easeOutQuint
}

dwindle {
  pseudotile = true
  preserve_split = true
}

$mod = SUPER
$terminal = alacritty
$launcher = fuzzel
$fileManager = nautilus || thunar || pcmanfm

bind = $mod, RETURN, exec, $terminal
bind = $mod, SPACE, exec, $launcher
bind = $mod, E, exec, $fileManager
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen
bind = $mod, L, exec, hyprlock
bind = $mod, P, pseudo
bind = $mod, J, togglesplit

# Screenshot: region -> clipboard, matches Omarchy's grim+slurp+swappy flow
bind = , PRINT, exec, grim -g "$(slurp)" - | swappy -f -

# Focus movement
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Media/volume/brightness keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
